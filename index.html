<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snaplyzo</title>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #000; color: #fff; padding-bottom: 70px; }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #1c1c1e; position: sticky; top: 0; background: #000; z-index: 10; }
        .logo { font-size: 24px; font-weight: bold; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-icons { display: flex; gap: 15px; align-items: center; }
        
        /* Stories Bar */
        .stories-container { display: flex; gap: 12px; padding: 12px; overflow-x: auto; border-bottom: 1px solid #1c1c1e; scrollbar-width: none; }
        .stories-container::-webkit-scrollbar { display: none; }
        .story { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; }
        .story-avatar { width: 62px; height: 62px; border-radius: 50%; padding: 2px; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .story-avatar img { width: 100%; height: 100%; border-radius: 50%; border: 2px solid #000; object-fit: cover; }
        
        /* Feed */
        .feed { max-width: 480px; margin: 0 auto; min-height: 200px; }
        .post { margin-bottom: 20px; border-bottom: 1px solid #121212; }
        .post-header { padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 14px; }
        .post-header-user { display: flex; align-items: center; gap: 8px; }
        .user-pic { width: 32px; height: 32px; border-radius: 50%; background: #333; }
        .post img, .post video { width: 100%; max-height: 550px; object-fit: cover; display: block; background: #111; }
        .post-actions { padding: 10px 12px; display: flex; justify-content: space-between; font-size: 22px; }
        .action-btns { display: flex; gap: 16px; }
        .post-info { padding: 0 12px 12px 12px; font-size: 14px; line-height: 1.4; }
        .likes-count { font-weight: 600; margin-bottom: 4px; }

        /* Navigation */
        .nav { position: fixed; bottom: 0; left: 0; right: 0; background: #000; border-top: 1px solid #1c1c1e; display: flex; justify-content: space-around; padding: 12px 0; max-width: 480px; margin: 0 auto; z-index: 10; }
        .nav button { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; }
        
        /* Instagram Camera Style Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; flex-direction: column; justify-content: space-between; }
        .cam-header { display: flex; justify-content: space-between; padding: 20px; align-items: center; z-index: 10; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
        .cam-close { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
        
        .cam-viewport { position: relative; width: 100%; flex: 1; display: flex; justify-content: center; align-items: center; overflow: hidden; background: #111; }
        #cameraPreview { width: 100%; height: 100%; object-fit: cover; }
        #previewContainer { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; background: #000; }
        #previewContainer img, #previewContainer video { width: 100%; height: 100%; object-fit: cover; }

        .cam-footer { padding: 25px 20px; display: flex; flex-direction: column; gap: 15px; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); }
        .cam-controls { display: flex; justify-content: space-around; align-items: center; width: 100%; }
        
        .shutter-btn { width: 75px; height: 75px; border-radius: 50%; border: 4px solid #fff; background: transparent; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .shutter-inner { width: 60px; height: 60px; border-radius: 50%; background: #fff; transition: 0.2s; }
        .shutter-btn.recording .shutter-inner { background: #ff3b30; border-radius: 8px; width: 35px; height: 35px; }

        .gallery-picker-btn { background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 10px 15px; border-radius: 20px; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        
        input[type="text"] { width: 100%; padding: 12px; background: #2c2c2e; border: 1px solid #3a3a3c; border-radius: 8px; color: white; font-size: 14px; }
        .btn-post { background: #0095f6; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; font-size: 16px; }
        
        .btn-live { background: #e50914; color: white; border: none; padding: 5px 12px; border-radius: 18px; font-weight: 600; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 4px; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="logo">Snaplyzo</div>
        <div class="header-icons">
            <button class="btn-live" onclick="openLiveModal()">🔴 LIVE</button>
            <span style="font-size:20px;">🤍</span>
            <span style="font-size:20px;">⚡</span>
        </div>
    </div>

    <!-- Stories Bar -->
    <div class="stories-container">
        <div class="story">
            <div class="story-avatar"><img src="https://picsum.photos/100/100?random=1" alt="You"></div>
            <span>Your story</span>
        </div>
        <div class="story">
            <div class="story-avatar"><img src="https://picsum.photos/100/100?random=2" alt="User"></div>
            <span>alex_99</span>
        </div>
        <div class="story">
            <div class="story-avatar"><img src="https://picsum.photos/100/100?random=3" alt="User"></div>
            <span>riya_vlog</span>
        </div>
        <div class="story">
            <div class="story-avatar"><img src="https://picsum.photos/100/100?random=4" alt="User"></div>
            <span>fun_memes</span>
        </div>
    </div>

    <!-- Feed Container -->
    <div class="feed" id="feed">
        <p style="text-align:center; color:#888; margin-top: 40px;">लोड हो रहा है...</p>
    </div>

    <!-- Bottom Nav -->
    <div class="nav">
        <button onclick="location.reload()">🏠</button>
        <button onclick="alert('सर्च फ़ीचर चालू है!')">🔍</button>
        <button onclick="openCameraModal()" style="font-size:26px; font-weight:bold;">➕</button>
        <button onclick="alert('रील्स सेक्शन ऑन है!')">🎬</button>
        <button onclick="alert('प्रोफ़ाइल सेक्शन ऑन है!')">👤</button>
    </div>

    <!-- Instagram Style Camera & Media Modal -->
    <div id="cameraModal" class="modal">
        <div class="cam-header">
            <button class="cam-close" onclick="closeCameraModal()">✕</button>
            <span style="font-weight:600; font-size:16px;">नया पोस्ट / रील</span>
            <span style="width:24px;"></span>
        </div>

        <div class="cam-viewport">
            <video id="cameraPreview" autoplay playsinline muted></video>
            <div id="previewContainer"></div>
        </div>

        <div class="cam-footer">
            <div id="captionBox" style="display:none; flex-direction:column; gap:10px;">
                <input type="text" id="caption" placeholder="कैप्शन लिखें...">
                <button class="btn-post" onclick="uploadCapturedMedia()" id="uploadBtn">शेयर करें</button>
            </div>

            <div class="cam-controls" id="camControls">
                <button class="gallery-picker-btn" onclick="document.getElementById('hiddenFileInput').click()">
                    📁 गैलरी
                </button>
                <input type="file" id="hiddenFileInput" accept="image/*,video/*" style="display:none" onchange="handleGallerySelect(event)">

                <button class="shutter-btn" onclick="takeSnapshotOrRecord()" id="shutterBtn">
                    <div class="shutter-inner"></div>
                </button>

                <button class="gallery-picker-btn" onclick="switchCamera()">
                    🔄 कैमरा
                </button>
            </div>
        </div>
    </div>

    <!-- Live Stream Modal -->
    <div id="liveModal" class="modal" style="background:rgba(0,0,0,0.85); justify-content:center; align-items:center;">
        <div style="background:#1c1c1e; padding:20px; border-radius:14px; width:85%; max-width:380px; text-align:center;">
            <h3 style="margin-top:0; color:#ff3b30;">🔴 लाइव स्ट्रीमिंग</h3>
            <video id="liveStream" autoplay playsinline muted style="width:100%; height:250px; background:#000; border-radius:10px; object-fit:cover; margin:10px 0;"></video>
            <button style="background:#ff3b30; color:#fff; border:none; padding:10px 20px; border-radius:8px; font-weight:600; cursor:pointer;" onclick="closeModal('liveModal')">बंद करें</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://jcdhkcgaktzopdnnnhpm.supabase.co";
        const SUPABASE_KEY = "sb_publishable_EV5HJ_JH50UcN4yT6oW6Hw_7Fh6B-cd";
        const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let mediaStream = null;
        let recordedFile = null;
        let useFrontCamera = false;

        async function openCameraModal() {
            document.getElementById('cameraModal').style.display = 'flex';
            document.getElementById('previewContainer').style.display = 'none';
            document.getElementById('cameraPreview').style.display = 'block';
            document.getElementById('captionBox').style.display = 'none';
            document.getElementById('camControls').style.display = 'flex';
            recordedFile = null;

            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: useFrontCamera ? 'user' : 'environment' },
                    audio: true
                });
                document.getElementById('cameraPreview').srcObject = mediaStream;
            } catch (err) {
                alert("कैमरा और माइक की अनुमति दें!");
            }
        }

        function closeCameraModal() {
            document.getElementById('cameraModal').style.display = 'none';
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }
        }

        async function switchCamera() {
            useFrontCamera = !useFrontCamera;
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: useFrontCamera ? 'user' : 'environment' },
                    audio: true
                });
                document.getElementById('cameraPreview').srcObject = mediaStream;
            } catch (err) {
                alert("कैमरा बदलने में समस्या आई!");
            }
        }

        // फोटो खींचने का फंक्शन (शटर बटन)
        function takeSnapshotOrRecord() {
            const videoElement = document.getElementById('cameraPreview');
            const canvas = document.createElement('canvas');
            canvas.width = videoElement.videoWidth || 720;
            canvas.height = videoElement.videoHeight || 1280;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(blob => {
                recordedFile = new File([blob], `snap_${Date.now()}.jpg`, { type: 'image/jpeg' });
                showPreview(URL.createObjectURL(recordedFile), 'image');
            }, 'image/jpeg', 0.9);
        }

        // गैलरी से चुनने पर
        function handleGallerySelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            recordedFile = file;
            const isVideo = file.type.includes('video');
            showPreview(URL.createObjectURL(file), isVideo ? 'video' : 'image');
        }

        function showPreview(url, type) {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }
            const previewContainer = document.getElementById('previewContainer');
            previewContainer.innerHTML = type === 'video' 
                ? `<video src="${url}" controls autoplay loop style="width:100%;height:100%;object-fit:cover;"></video>`
                : `<img src="${url}" style="width:100%;height:100%;object-fit:cover;">`;
            
            previewContainer.style.display = 'block';
            document.getElementById('cameraPreview').style.display = 'none';
            document.getElementById('camControls').style.display = 'none';
            document.getElementById('captionBox').style.display = 'flex';
        }

        // Supabase पर अपलोड करने का मुख्य फंक्शन
        async function uploadCapturedMedia() {
            if (!recordedFile) return alert("कृपया पहले फोटो लें या चुनें!");
            const caption = document.getElementById('caption').value;
            const uploadBtn = document.getElementById('uploadBtn');

            uploadBtn.innerText = "अपलोड हो रहा है...";
            uploadBtn.disabled = true;

            try {
                const fileExt = recordedFile.name.split('.').pop().toLowerCase();
                const cleanFileName = `${Date.now()}_${Math.floor(Math.random()*1000)}.${fileExt}`;

                const { error } = await dbClient.storage.from('media').upload(cleanFileName, recordedFile, {
                    cacheControl: '3600',
                    upsert: true
                });

                if (error) {
                    alert("स्टोरेज अपलोड एरर: " + error.message);
                    uploadBtn.innerText = "शेयर करें";
                    uploadBtn.disabled = false;
                    return;
                }

                const { data: publicUrlData } = dbClient.storage.from('media').getPublicUrl(cleanFileName);
                const mediaUrl = publicUrlData.publicUrl;

                const { error: dbError } = await dbClient.from('posts').insert([
                    { image_url: mediaUrl, caption: caption, username: "user_" + Math.floor(Math.random() * 900 + 100) }
                ]);

                if (dbError) {
                    alert("डेटाबेस सेव एरर: " + dbError.message);
                } else {
                    alert("पोस्ट सफलतापूर्वक शेयर हो गई! 🎉");
                    closeCameraModal();
                    loadPosts();
                }
            } catch (err) {
                alert("अपलोड में समस्या आई: " + err.message);
            }

            uploadBtn.innerText = "शेयर करें";
            uploadBtn.disabled = false;
        }

        // फीड लोड करने का फंक्शन
        async function loadPosts() {
            const feed = document.getElementById('feed');
            try {
                const { data, error } = await dbClient.from('posts').select('*').order('created_at', { ascending: false });
                if (error || !data || data.length === 0) {
                    feed.innerHTML = '<p style="text-align:center; color:#888; margin-top:40px;">अभी कोई पोस्ट नहीं है। ➕ दबाकर पहली फोटो या रील बनाएँ!</p>';
                    return;
                }

                feed.innerHTML = '';
                data.forEach(item => {
                    const url = item.image_url || '';
                    const isVideo = url.toLowerCase().includes('.mp4') || url.toLowerCase().includes('.mov') || url.toLowerCase().includes('.webm');
                    const mediaHTML = isVideo ? `<video src="${url}" controls loop playsinline></video>` : `<img src="${url}" alt="Post">`;

                    feed.innerHTML += `
                        <div class="post">
                            <div class="post-header">
                                <div class="post-header-user">
                                    <div class="user-pic"></div>
                                    <span>${item.username || 'Snaplyzer'}</span>
                                </div>
                                <span>•••</span>
                            </div>
                            ${mediaHTML}
                            <div class="post-actions">
                                <div class="action-btns">
                                    <span style="cursor:pointer;" onclick="this.innerText = this.innerText === '❤️' ? '🤍' : '❤️'">🤍</span>
                                    <span>💬</span>
                                    <span>🚀</span>
                                </div>
                                <span>🔖</span>
                            </div>
                            <div class="post-info">
                                <div class="likes-count">1 likes</div>
                                <b>${item.username || 'Snaplyzer'}</b> ${item.caption || ''}
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                feed.innerHTML = '<p style="text-align:center; color:#ff4d4d; margin-top:30px;">नेटवर्क कनेक्शन एरर!</p>';
            }
        }

        function openLiveModal() { document.getElementById('liveModal').style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        loadPosts();
    </script>
</body>
</html>
