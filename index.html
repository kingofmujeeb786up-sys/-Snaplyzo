<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snaplyzo</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #000; color: #fff; margin: 0; padding-bottom: 70px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #222; position: sticky; top: 0; background: #000; z-index: 10; }
        .logo { font-size: 22px; font-weight: bold; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .feed { max-width: 480px; margin: 0 auto; }
        .post { margin-bottom: 25px; border-bottom: 1px solid #1a1a1a; }
        .post-header { padding: 10px 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .post img, .post video { width: 100%; max-height: 550px; object-fit: cover; display: block; background: #111; }
        .post-actions { padding: 10px 12px; display: flex; gap: 15px; font-size: 20px; }
        .post-info { padding: 0 12px 12px 12px; font-size: 14px; }
        .nav { position: fixed; bottom: 0; left: 0; right: 0; background: #000; border-top: 1px solid #222; display: flex; justify-content: space-around; padding: 12px 0; max-width: 480px; margin: 0 auto; }
        .nav button { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; }
        .btn { background: #0095f6; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn-live { background: #e50914; color: white; border: none; padding: 6px 12px; border-radius: 20px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; font-size: 13px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #1c1c1e; padding: 20px; border-radius: 14px; width: 85%; max-width: 380px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        input[type="text"] { width: 100%; padding: 10px; margin: 12px 0; box-sizing: border-box; background: #2c2c2e; border: 1px solid #3a3a3c; border-radius: 8px; color: white; }
        input[type="file"] { margin: 12px 0; color: #aaa; width: 100%; }
        #liveStream { width: 100%; height: 320px; background: #000; border-radius: 10px; object-fit: cover; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">Snaplyzo</div>
        <button class="btn-live" onclick="openLiveModal()">🔴 LIVE</button>
    </div>

    <!-- फ़ीड (Posts & Reels) -->
    <div class="feed" id="feed">
        <p style="text-align:center; color:#888; margin-top: 40px;">लोड हो रहा है...</p>
    </div>

    <!-- बॉटम नेविगेशन -->
    <div class="nav">
        <button onclick="location.reload()">🏠</button>
        <button onclick="openUploadModal()">➕</button>
    </div>

    <!-- गैलरी से फोटो/रील अपलोड मोडल -->
    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0;">फोटो या रील अपलोड करें</h3>
            <input type="file" id="mediaFile" accept="image/*,video/*">
            <input type="text" id="caption" placeholder="कैप्शन लिखें...">
            <div style="display:flex; gap:10px; justify-content: center; margin-top: 10px;">
                <button class="btn" onclick="uploadMedia()" id="uploadBtn">पोस्ट करें</button>
                <button class="btn" style="background:#3a3a3c;" onclick="closeModal('uploadModal')">रद्द करें</button>
            </div>
        </div>
    </div>

    <!-- Live Stream Modal (0 Followers Supported) -->
    <div id="liveModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0; color:#ff3b30;">🔴 लाइव स्ट्रीमिंग</h3>
            <video id="liveStream" autoplay playsinline muted></video>
            <div style="display:flex; gap:10px; justify-content: center; margin-top: 15px;">
                <button class="btn" style="background:#ff3b30;" onclick="stopLive()">End Live</button>
                <button class="btn" style="background:#3a3a3c;" onclick="closeModal('liveModal'); stopLive();">बंद करें</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://jcdhkcgaktzopdnnnhpm.supabase.co";
        const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY"; // ⚠️ यहाँ अपनी Supabase Anon Key डालें
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let localStream = null;

        // गैलरी से फोटो / रील अपलोड फ़ंक्शन
        async function uploadMedia() {
            const fileInput = document.getElementById('mediaFile');
            const caption = document.getElementById('caption').value;
            const uploadBtn = document.getElementById('uploadBtn');
            const file = fileInput.files[0];

            if (!file) return alert("कृपया अपनी गैलरी से कोई फोटो या रील (वीडियो) सेलेक्ट करें!");

            uploadBtn.innerText = "अपलोड हो रहा है...";
            uploadBtn.disabled = true;

            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}.${fileExt}`;

            // 1. Storage (media bucket) में फ़ाइल अपलोड
            const { data, error } = await supabase.storage.from('media').upload(fileName, file);

            if (error) {
                alert("अपलोड एरर: " + error.message);
                uploadBtn.innerText = "पोस्ट करें";
                uploadBtn.disabled = false;
                return;
            }

            // 2. Public URL प्राप्त करें
            const { data: publicUrlData } = supabase.storage.from('media').getPublicUrl(fileName);
            const mediaUrl = publicUrlData.publicUrl;

            // 3. Database Table (posts) में डेटा सेव करें
            const { error: dbError } = await supabase.from('posts').insert([
                { image_url: mediaUrl, caption: caption, username: "user_" + Math.floor(Math.random() * 900 + 100) }
            ]);

            if (dbError) {
                alert("डेटाबेस एरर: " + dbError.message);
            } else {
                alert("सफलतापूर्वक पोस्ट हो गया! 🎉");
                closeModal('uploadModal');
                loadPosts();
            }
            uploadBtn.innerText = "पोस्ट करें";
            uploadBtn.disabled = false;
        }

        // फ़ीड में पोस्ट्स और रील्स लोड करें
        async function loadPosts() {
            const { data, error } = await supabase.from('posts').select('*').order('created_at', { ascending: false });
            const feed = document.getElementById('feed');

            if (error) {
                feed.innerHTML = '<p style="text-align:center; color:red;">डेटा लोड करने में समस्या हुई!</p>';
                return;
            }

            if (!data || data.length === 0) {
                feed.innerHTML = '<p style="text-align:center; color:#888; margin-top:40px;">अभी तक कोई पोस्ट नहीं है। ➕ दबाकर पहली पोस्ट डालें!</p>';
                return;
            }

            feed.innerHTML = '';
            data.forEach(item => {
                const url = item.image_url || '';
                const isVideo = url.endsWith('.mp4') || url.endsWith('.mov') || url.endsWith('.webm') || url.endsWith('.mkv');
                
                const mediaHTML = isVideo 
                    ? `<video src="${url}" controls loop playsinline></video>`
                    : `<img src="${url}" alt="Post">`;

                feed.innerHTML += `
                    <div class="post">
                        <div class="post-header">👤 ${item.username || 'Snaplyzer'}</div>
                        ${mediaHTML}
                        <div class="post-actions">❤️ 💬 🚀</div>
                        <div class="post-info">
                            <b>${item.username || 'Snaplyzer'}</b> ${item.caption || ''}
                        </div>
                    </div>
                `;
            });
        }

        // 0-Follower Live Camera Access
        async function openLiveModal() {
            document.getElementById('liveModal').style.display = 'flex';
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('liveStream').srcObject = localStream;
            } catch (err) {
                alert("कैमरा/माइक एक्सेस करने की अनुमति नहीं मिली!");
            }
        }

        function stopLive() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
        }

        function openUploadModal() { document.getElementById('uploadModal').style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        loadPosts();
    </script>
</body>
</html>
