<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snaplyzo - NextGen Social</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #000000;
            --card-bg: #121212;
            --border: #262626;
            --accent: #e1306c;
            --text: #ffffff;
            --text-secondary: #a8a8a8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 60px;
            max-width: 480px;
            margin: 0 auto;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            min-height: 100vh;
        }

        /* Instagram Style Top Header */
        header {
            position: sticky;
            top: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-icons {
            display: flex;
            gap: 18px;
            font-size: 1.2rem;
        }

        /* Stories Bar */
        .stories-container {
            display: flex;
            gap: 12px;
            padding: 12px 16px;
            overflow-x: auto;
            border-bottom: 1px solid var(--border);
            scrollbar-width: none;
        }
        .stories-container::-webkit-scrollbar { display: none; }

        .story-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .story-ring {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
        }

        .story-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #000;
        }

        /* Feed Posts */
        .post-card {
            border-bottom: 1px solid var(--border);
            background: var(--bg);
        }

        .post-header {
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .post-img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            display: block;
        }

        .post-actions {
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            font-size: 1.3rem;
        }

        .left-actions {
            display: flex;
            gap: 16px;
        }

        .viral-badge {
            background: rgba(225, 48, 108, 0.15);
            color: #ff477e;
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 600;
            border: 1px solid rgba(225, 48, 108, 0.3);
        }

        .post-details {
            padding: 0 14px 12px 14px;
            font-size: 0.85rem;
        }

        .likes-count {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .caption-text span {
            font-weight: 600;
            margin-right: 5px;
        }

        /* Bottom Navbar */
        nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            background: var(--bg);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid var(--border);
            z-index: 100;
        }

        .nav-link {
            color: var(--text);
            font-size: 1.3rem;
            background: none;
            border: none;
            cursor: pointer;
        }

        /* Modal styling */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        .modal-card {
            background: var(--card-bg);
            width: 90%;
            max-width: 380px;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        input, textarea, .btn {
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #000;
            color: #fff;
        }

        .btn-primary {
            background: #0095f6;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-ai {
            background: linear-gradient(45deg, #833ab4, #fd1d1d);
            border: none;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Top Instagram Header -->
    <header>
        <div class="logo">Snaplyzo</div>
        <div class="header-icons">
            <i class="fa-regular fa-heart"></i>
            <i class="fa-paper-plane" onclick="shareApp()"></i>
        </div>
    </header>

    <!-- Instagram Stories Bar -->
    <div class="stories-container">
        <div class="story-item">
            <div class="story-ring"><img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" class="story-img"></div>
            <span>You</span>
        </div>
        <div class="story-item">
            <div class="story-ring"><img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100" class="story-img"></div>
            <span>Alex</span>
        </div>
        <div class="story-item">
            <div class="story-ring"><img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100" class="story-img"></div>
            <span>Riya</span>
        </div>
    </div>

    <!-- Home Feed -->
    <div id="feed">
        <!-- Dynamic Feed Items -->
    </div>

    <!-- Instagram Bottom Navigation Bar -->
    <nav>
        <button class="nav-link" onclick="fetchFeed()"><i class="fa-solid fa-house"></i></button>
        <button class="nav-link" onclick="alert('Explore Trending!')"><i class="fa-solid fa-magnifying-glass"></i></button>
        <button class="nav-link" onclick="openModal()"><i class="fa-regular fa-square-plus"></i></button>
        <button class="nav-link" onclick="alert('Reels & Shorts')"><i class="fa-solid fa-clapperboard"></i></button>
        <button class="nav-link" onclick="alert('Profile Page')"><i class="fa-regular fa-circle-user"></i></button>
    </nav>

    <!-- Create Post Modal -->
    <div class="modal" id="postModal">
        <div class="modal-card">
            <h3 style="text-align: center;">नई पोस्ट/रिल बनाएँ</h3>
            <input type="text" id="imgUrl" placeholder="Image URL (जैसे Unsplash लिंक)">
            <textarea id="caption" rows="3" placeholder="कैप्शन लिखें..."></textarea>
            
            <!-- AI Creator Feature -->
            <button class="btn btn-ai" onclick="generateAutoCaption()">✨ AI Auto Caption & Hashtags</button>
            <button class="btn btn-primary" onclick="createPost()">Post Now (Instant Boost ⚡)</button>
            <button class="btn" style="background:#262626;" onclick="closeModal()">रद्द करें</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 🔑 अपनी SUPABASE API यहाँ पेस्ट करें
        // ==========================================
        const SUPABASE_URL = "YOUR_SUPABASE_URL_HERE";
        const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY_HERE";

        let supabaseClient = null;
        if (SUPABASE_URL !== "YOUR_SUPABASE_URL_HERE") {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }

        // 1. Fetch Feed
        async function fetchFeed() {
            const feedContainer = document.getElementById('feed');
            feedContainer.innerHTML = '<p style="text-align:center; padding:30px; color:#8e8e8e;">लोड हो रहा है...</p>';

            let posts = [];

            if (supabaseClient) {
                const { data, error } = await supabaseClient
                    .from('posts')
                    .select('*')
                    .order('created_at', { ascending: false });
                
                if (!error && data) posts = data;
            }

            // Fallback UI Demo Data
            if (posts.length === 0) {
                posts = [
                    {
                        id: 1,
                        username: "creative_guy",
                        image_url: "https://images.unsplash.com/photo-1518791841217-8f162f1e1131",
                        caption: "Snaplyzo पर मेरी पहली पोस्ट! 🔥 #Viral #Snaplyzo",
                        likes: 482,
                        is_boosted: true
                    },
                    {
                        id: 2,
                        username: "travel_diaries",
                        image_url: "https://images.unsplash.com/photo-1469854523086-cc02fe5d8800",
                        caption: "खूबसूरत वादियाँ! 🏔️ #Wanderlust",
                        likes: 1290,
                        is_boosted: false
                    }
                ];
            }

            // Render Instagram-like Feed
            feedContainer.innerHTML = posts.map(post => `
                <div class="post-card">
                    <div class="post-header">
                        <div class="user-info">
                            <div class="user-avatar">${post.username[0].toUpperCase()}</div>
                            <strong>${post.username}</strong>
                        </div>
                        ${post.is_boosted ? '<span class="viral-badge">⚡ AI Boosted</span>' : '<i class="fa-solid fa-ellipsis"></i>'}
                    </div>
                    <img src="${post.image_url}" class="post-img" alt="Post">
                    <div class="post-actions">
                        <div class="left-actions">
                            <i class="fa-regular fa-heart" onclick="toggleLike(this, ${post.id})"></i>
                            <i class="fa-regular fa-comment"></i>
                            <i class="fa-regular fa-paper-plane" onclick="sharePost()"></i>
                        </div>
                        <i class="fa-regular fa-bookmark"></i>
                    </div>
                    <div class="post-details">
                        <div class="likes-count"><span class="like-num">${post.likes}</span> likes</div>
                        <div class="caption-text"><span>${post.username}</span> ${post.caption}</div>
                    </div>
                </div>
            `).join('');
        }

        // 2. AI Auto Caption
        function generateAutoCaption() {
            const captions = [
                "वक्त बदलने में वक्त नहीं लगता! 🔥 #Trending #Snaplyzo #Viral",
                "New post alert! Check this out 🚀 #ExplorePage #CreatorSpace",
                "Keep going, success is near! 💪 #Motivation #DailyVibes"
            ];
            document.getElementById('caption').value = captions[Math.floor(Math.random() * captions.length)];
        }

        // 3. Create Post
        async function createPost() {
            const imageUrl = document.getElementById('imgUrl').value;
            const caption = document.getElementById('caption').value;

            if (!imageUrl) {
                alert("कृपया फ़ोटो की इमेज लिंक डालें!");
                return;
            }

            if (supabaseClient) {
                const { error } = await supabaseClient.from('posts').insert([
                    {
                        username: "user_" + Math.floor(Math.random() * 899 + 100),
                        image_url: imageUrl,
                        caption: caption,
                        likes: 1,
                        is_boosted: true
                    }
                ]);

                if (error) alert("Error: " + error.message);
                else {
                    alert("आपकी पोस्ट Instagram-स्टाइल UI में बूस्ट हो गई है! 🚀");
                    closeModal();
                    fetchFeed();
                }
            } else {
                alert("Demo Mode: आपकी पोस्ट इंस्टाग्राम फ़ीड में जुड़ गई!");
                closeModal();
            }
        }

        // 4. Interactive Like System
        function toggleLike(element, postId) {
            let details = element.closest('.post-card').querySelector('.like-num');
            let currentLikes = parseInt(details.innerText);

            if (element.classList.contains('fa-regular')) {
                element.classList.remove('fa-regular');
                element.classList.add('fa-solid');
                element.style.color = '#e1306c';
                details.innerText = currentLikes + 1;
            } else {
                element.classList.remove('fa-solid');
                element.classList.add('fa-regular');
                element.style.color = '#ffffff';
                details.innerText = currentLikes - 1;
            }
        }

        // 5. Direct Web Link Sharing
        function sharePost() {
            if (navigator.share) {
                navigator.share({
                    title: 'Snaplyzo',
                    text: 'Snaplyzo पर यह कमाल का कंटेंट देखें!',
                    url: window.location.href,
                });
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert("लिंक कॉपी हो गया! दोस्तों को भेजें।");
            }
        }

        function shareApp() { sharePost(); }
        function openModal() { document.getElementById('postModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('postModal').style.display = 'none'; }

        // Start
        fetchFeed();
    </script>
</body>
</html>
