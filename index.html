<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #000; color: #fff; height: 100vh; overflow: hidden; }
        
        /* App Containers */
        .page { display: none; height: 100vh; width: 100%; position: absolute; background: #000; }
        .page.active { display: flex; flex-direction: column; }
        
        /* Chat Room UI */
        #chat-interface { z-index: 200; }
        .top-bar { display: flex; justify-content: space-between; padding: 15px; border-bottom: 1px solid #262626; align-items: center; }
        .msg-area { flex: 1; overflow-y: auto; padding: 15px; }
        
        /* Calling Overlay */
        #call-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: #1a1a1a; display:none; z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        .call-avatar { width: 120px; height: 120px; border-radius: 50%; margin-bottom: 20px; }
        .call-controls { display: flex; gap: 40px; margin-top: 50px; }
        .btn-call { width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 24px; cursor: pointer; }
        
        /* Bottom Nav */
        .bottom-nav { height: 50px; border-top: 1px solid #262626; display: flex; justify-content: space-around; align-items: center; }
    </style>
</head>
<body>

    <!-- Chat Screen -->
    <div id="chat-interface" class="page active">
        <div class="top-bar">
            <span onclick="alert('Back')">←</span>
            <strong id="contact-name">Sanskari Balak</strong>
            <div style="display: flex; gap: 20px;">
                <span onclick="startCall('audio')">📞</span>
                <span onclick="startCall('video')">📹</span>
            </div>
        </div>
        <div class="msg-area" id="msgs">
            <div style="text-align: center; color: #666; font-size: 12px;">आज 3:15 PM</div>
        </div>
        <div style="padding: 10px; background: #000;">
            <input type="text" id="msg-input" placeholder="Message..." style="width:100%; padding:12px; border-radius:20px; border:1px solid #333; background: #111; color: white;">
        </div>
    </div>

    <!-- Calling Overlay (UI for Call) -->
    <div id="call-overlay">
        <img src="https://picsum.photos/200" class="call-avatar" id="call-img">
        <h2 id="call-status">Calling...</h2>
        <div class="call-controls">
            <button class="btn-call" style="background: red;" onclick="endCall()">❌</button>
            <button class="btn-call" style="background: green;" onclick="alert('Connected!')">📞</button>
        </div>
    </div>

    <script>
        // कॉल शुरू करने का फंक्शन
        function startCall(type) {
            const overlay = document.getElementById('call-overlay');
            const status = document.getElementById('call-status');
            
            overlay.style.display = 'flex';
            status.innerText = type === 'audio' ? 'Audio Calling...' : 'Video Calling...';
            
            // यहाँ आप WebRTC या किसी API (जैसे Agora/Firebase) को जोड़ सकते हैं
            console.log(type + " call started");
        }

        // कॉल खत्म करने का फंक्शन
        function endCall() {
            document.getElementById('call-overlay').style.display = 'none';
        }

        // मैसेज भेजने का फंक्शन
        document.getElementById('msg-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && this.value) {
                const msg = document.createElement('div');
                msg.style.padding = '8px 12px';
                msg.style.background = '#0095f6';
                msg.style.borderRadius = '18px';
                msg.style.margin = '5px 0';
                msg.style.alignSelf = 'flex-end';
                msg.innerText = this.value;
                document.getElementById('msgs').appendChild(msg);
                this.value = '';
            }
        });
    </script>
</body>
</html>
