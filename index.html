<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snaplyzo</title>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #000; color: #fff; padding-bottom: 70px; }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #1c1c1e; position: sticky; top: 0; background: #000; z-index: 10; }
        .logo { font-size: 24px; font-weight: bold; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-icons { display: flex; gap: 15px; align-items: center; }
        
        /* Stories Bar */
        .stories-container { display: flex; gap: 12px; padding: 12px; overflow-x: auto; border-bottom: 1px solid #1c1c1e; scrollbar-width: none; }
        .stories-container::-webkit-scrollbar { display: none; }
        .story { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; }
        .story-avatar { width: 62px; height: 62px; border-radius: 50%; padding: 2px; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .story-avatar img { width: 100%; height: 100%; border-radius: 50%; border: 2px solid #000; object-fit: cover; }
        
        /* Feed */
        .feed { max-width: 480px; margin: 0 auto; min-height: 200px; }
        .post { margin-bottom: 20px; border-bottom: 1px solid #121212; }
        .post-header { padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 14px; }
        .post-header-user { display: flex; align-items: center; gap: 8px; }
        .user-pic { width: 32px; height: 32px; border-radius: 50%; background: #333; }
        .post img, .post video { width: 100%; max-height: 550px; object-fit: cover; display: block; background: #111; }
        .post-actions { padding: 10px 12px; display: flex; justify-content: space-between; font-size: 22px; }
        .action-btns { display: flex; gap: 16px; }
        .post-info { padding: 0 12px 12px 12px; font-size: 14px; line-height: 1.4; }
        .likes-count { font-weight: 600; margin-bottom: 4px; }

        /* Navigation */
        .nav { position: fixed; bottom: 0; left: 0; right: 0; background: #000; border-top: 1px solid #1c1c1e; display: flex; justify-content: space-around; padding: 12px 0; max-width: 480px; margin: 0 auto; z-index: 10; }
        .nav button { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; }
        
        /* Modals & Buttons */
        .btn-live { background: #e50914; color: white; border: none; padding: 5px 12px; border-radius: 18px; font-weight: 600; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 4px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #1c1c1e; padding: 20px; border-radius: 14px; width: 85%; max-width: 380px; text-align: center; }
        input[type="text"] { width: 100%; padding: 10px; margin: 12px 0; background: #2c2c2e; border: 1px solid #3a3a3c; border-radius: 8px; color: white; }
        input[type="file"] { margin: 12px 0; color: #aaa; width: 100%; }
        .btn { background: #0095f6; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        #liveStream { width: 100%; height: 300px; background: #000; border-radius: 10px; object-fit: cover; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="logo">Snaplyzo</div>
        <div class="header-icons">
            <button class="btn-live" onclick="openLiveModal()">🔴 LIVE</button>
            <span style="font-size:20px;">🤍</span>
            <span style="font-size:20px;">⚡</span>
        </div>
    </div>

    <!-- Stories Bar -->
    <div class="stories-container">
        <div class="story">
            <div class="story-avatar"><img src="https://picsum.photos/100/100?random=1" alt="You"></div>
            <span>Your story</span>
        </div>
        <div class="story">
            <div class="story-avatar"><img src="https://picsum.photos/100/100?random=2" alt="User"></div>
            <span>alex_99</span>
        </div>
        <div class="story">
            <div class="story-avatar"><img src="https://picsum.photos/100/100?random=3" alt="User"></div>
            <span>riya_vlog</span>
        </div>
        <div class="story">
            <div class="story-avatar"><img src="https://picsum.photos/100/100?random=4" alt="User"></div>
            <span>fun_memes</span>
        </div>
    </div>

    <!-- Feed Container -->
    <div class="feed" id="feed">
        <p style="text-align:center; color:#888; margin-top: 40px;">लोड हो रहा है...</p>
    </div>

    <!-- Bottom Nav -->
    <div class="nav">
        <button onclick="location.reload()">🏠</button>
        <button onclick="alert('सर्च फ़ीचर चालू है!')">🔍</button>
        <button onclick="openUploadModal()" style="font-size:26px; font-weight:bold;">➕</button>
        <button onclick="alert('रील्स सेक्शन ऑन है!')">🎬</button>
        <button onclick="alert('प्रोफ़ाइल सेक्शन ऑन है!')">👤</button>
    </div>

    <!-- Media Upload Modal -->
    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0;">फोटो या रील अपलोड करें</h3>
            <input type="file" id="mediaFile" accept="image/*,video/*">
            <input type="text" id="caption" placeholder="कैप्शन लिखें...">
            <div style="display:flex; gap:10px; justify-content: center; margin-top: 10px;">
                <button class="btn" onclick="uploadMedia()" id="uploadBtn">पोस्ट करें</button>
                <button class="btn" style="background:#3a3a3c;" onclick="closeModal('uploadModal')">रद्द करें</button>
            </div>
        </div>
    </div>

    <!-- Live Stream Modal -->
    <div id="liveModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0; color:#ff3b30;">🔴 लाइव स्ट्रीमिंग (0 Followers)</h3>
            <video id="liveStream" autoplay playsinline muted></video>
            <div style="display:flex; gap:10px; justify-content: center; margin-top: 15px;">
                <button class="btn" style="background:#ff3b30;" onclick="stopLive()">End Live</button>
                <button class="btn" style="background:#3a3a3c;" onclick="closeModal('liveModal'); stopLive();">बंद करें</button>
            </div>
        </div>
    </div>

    <script>
        // Updated Supabase Configuration with New Key
        const SUPABASE_URL = "https://jcdhkcgaktzopdnnnhpm.supabase.co";
        const SUPABASE_KEY = "sb_publishable_EV5HJ_JH50UcN4yT6oW6Hw_7Fh6B-cd";
        
        const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let localStream = null;

        function openUploadModal() { document.getElementById('uploadModal').style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // Upload Gallery Media (Reels and Images)
        async function uploadMedia() {
            const fileInput = document.getElementById('mediaFile');
            const caption = document.getElementById('caption').value;
            const uploadBtn = document.getElementById('uploadBtn');
            const file = fileInput.files[0];

            if (!file) return alert("कृपया अपनी गैलरी से कोई फोटो या वीडियो चुनें!");

            uploadBtn.innerText = "अपलोड हो रहा है...";
            uploadBtn.disabled = true;

            try {
                const fileExt = file.name.split('.').pop().toLowerCase();
                const cleanFileName = `${Date.now()}_${Math.floor(Math.random()*1000)}.${fileExt}`;

                const { data, error } = await dbClient.storage.from('media').upload(cleanFileName, file, {
                    cacheControl: '3600',
                    upsert: true
                });

                if (error) {
                    alert("स्टोरेज अपलोड एरर: " + error.message);
                    uploadBtn.innerText = "पोस्ट करें";
                    uploadBtn.disabled = false;
                    return;
                }

                const { data: publicUrlData } = dbClient.storage.from('media').getPublicUrl(cleanFileName);
                const mediaUrl = publicUrlData.publicUrl;

                const { error: dbError } = await dbClient.from('posts').insert([
                    { image_url: mediaUrl, caption: caption, username: "user_" + Math.floor(Math.random() * 900 + 100) }
                ]);

                if (dbError) {
                    alert("डेटाबेस सेव एरर: " + dbError.message);
                } else {
                    alert("आपकी पोस्ट/रील सफलतापूर्वक अपलोड हो गई! 🎉");
                    document.getElementById('caption').value = '';
                    fileInput.value = '';
                    closeModal('uploadModal');
                    loadPosts();
                }
            } catch (err) {
                alert("अपलोड में समस्या आई: " + err.message);
            }

            uploadBtn.innerText = "पोस्ट करें";
            uploadBtn.disabled = false;
        }

        // Load Feed and Display Media Correctly
        async function loadPosts() {
            const feed = document.getElementById('feed');
            
            try {
                const { data, error } = await dbClient.from('posts').select('*').order('created_at', { ascending: false });

                if (error) {
                    feed.innerHTML = '<p style="text-align:center; color:#ff4d4d; margin-top:30px;">डेटा लोड करने में समस्या हुई!</p>';
                    return;
                }

                if (!data || data.length === 0) {
                    feed.innerHTML = '<p style="text-align:center; color:#888; margin-top:40px;">अभी कोई पोस्ट नहीं है। ➕ दबाकर पहली फोटो या रील अपलोड करें!</p>';
                    return;
                }

                feed.innerHTML = '';
                data.forEach(item => {
                    const url = item.image_url || '';
                    const lowerUrl = url.toLowerCase();
                    
                    const isVideo = lowerUrl.includes('.mp4') || lowerUrl.includes('.mov') || lowerUrl.includes('.webm') || lowerUrl.includes('.mkv') || lowerUrl.includes('.3gp');
                    
                    const mediaHTML = isVideo 
                        ? `<video src="${url}" controls loop playsinline preload="metadata"></video>`
                        : `<img src="${url}" alt="Post" loading="lazy">`;

                    feed.innerHTML += `
                        <div class="post">
                            <div class="post-header">
                                <div class="post-header-user">
                                    <div class="user-pic"></div>
                                    <span>${item.username || 'Snaplyzer'}</span>
                                </div>
                                <span>•••</span>
                            </div>
                            ${mediaHTML}
                            <div class="post-actions">
                                <div class="action-btns">
                                    <span style="cursor:pointer;" onclick="this.innerText = this.innerText === '❤️' ? '🤍' : '❤️'">🤍</span>
                                    <span style="cursor:pointer;">💬</span>
                                    <span style="cursor:pointer;">🚀</span>
                                </div>
                                <span style="cursor:pointer;">🔖</span>
                            </div>
                            <div class="post-info">
                                <div class="likes-count">1 likes</div>
                                <b>${item.username || 'Snaplyzer'}</b> ${item.caption || ''}
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                feed.innerHTML = '<p style="text-align:center; color:#ff4d4d; margin-top:30px;">नेटवर्क कनेक्शन एरर!</p>';
            }
        }

        // Live Stream
        async function openLiveModal() {
            document.getElementById('liveModal').style.display = 'flex';
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('liveStream').srcObject = localStream;
            } catch (err) {
                alert("कैमरा और माइक की अनुमति दें!");
            }
        }

        function stopLive() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
        }

        loadPosts();
    </script>
</body>
</html>
