<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snaplyzo Messenger</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0f141c; color: #ffffff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Top Header */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: #161f30; border-bottom: 1px solid #222d42; }
        .logo { font-size: 18px; font-weight: bold; color: #38bdf8; }

        /* Main Content Screens */
        .screen { flex: 1; display: none; flex-direction: column; overflow-y: auto; padding: 10px; }
        .screen.active { display: flex; }

        /* Chat Item Style */
        .chat-card { display: flex; align-items: center; justify-content: space-between; background: #161f30; padding: 12px; border-radius: 10px; margin-bottom: 8px; cursor: pointer; border: 1px solid #222d42; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; background: #38bdf8; color: #000; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; }

        /* Chat Room Screen */
        #chatRoom { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f141c; z-index: 100; display: none; flex-direction: column; }
        .chat-room-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #161f30; border-bottom: 1px solid #222d42; }
        .messages-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 70%; padding: 10px 14px; border-radius: 12px; font-size: 14px; word-break: break-word; }
        .msg.incoming { background: #222d42; align-self: flex-start; }
        .msg.outgoing { background: #0284c7; color: #fff; align-self: flex-end; }
        .chat-footer { display: flex; padding: 10px; background: #161f30; border-top: 1px solid #222d42; gap: 10px; }
        .chat-footer input { flex: 1; padding: 10px; background: #0f141c; border: 1px solid #222d42; border-radius: 8px; color: white; outline: none; }
        .chat-footer button { background: #0284c7; color: white; border: none; padding: 0 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* Call Screen Overlay */
        #callScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #070a0f; z-index: 200; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .call-avatar-big { width: 90px; height: 90px; border-radius: 50%; background: #0284c7; font-size: 32px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; border: 2px solid #38bdf8; }
        .call-buttons { display: flex; gap: 40px; margin-top: 40px; }
        .c-btn { width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: white; }

        /* Bottom Nav */
        .nav-bar { height: 55px; background: #161f30; border-top: 1px solid #222d42; display: flex; justify-content: space-around; align-items: center; }
        .nav-tab { background: none; border: none; color: #64748b; font-size: 20px; cursor: pointer; }
        .nav-tab.active { color: #38bdf8; }
    </style>
</head>
<body>

    <!-- Top Header -->
    <div class="header">
        <div class="logo">⚡ Snaplyzo</div>
        <div style="font-size: 18px; cursor: pointer;" onclick="alert('नोटिफिकेशन')">🔔</div>
    </div>

    <!-- Screen 1: Chats List -->
    <div id="chatsScreen" class="screen active">
        <div style="padding: 10px 0; font-size: 15px; font-weight: bold; color: #94a3b8;">कंवर्सेशन (Conversations)</div>
        <div class="chat-card" onclick="openChat('Sanskari Balak')">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div class="avatar">SB</div>
                <div>
                    <b>Sanskari Balak</b>
                    <div style="font-size: 12px; color: #94a3b8; margin-top: 3px;">नमस्ते! कैसे हो?</div>
                </div>
            </div>
            <span style="font-size: 12px; color: #38bdf8;">ऑनलाइन</span>
        </div>
    </div>

    <!-- Screen 2: Profile -->
    <div id="profileScreen" class="screen" style="align-items: center; justify-content: center; text-align: center;">
        <div class="avatar" style="width: 80px; height: 80px; font-size: 30px; margin: 0 auto 15px auto;">M</div>
        <h2>Mujeeb Mujeeb</h2>
        <p style="color: #94a3b8; font-size: 13px; margin-top: 5px;">डेवलपर और क्रिएटर</p>
    </div>

    <!-- Chat Room UI -->
    <div id="chatRoom">
        <div class="chat-room-header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 20px; cursor: pointer;" onclick="closeChat()">←</span>
                <b id="roomName">User</b>
            </div>
            <div style="display: flex; gap: 20px; font-size: 18px; cursor: pointer;">
                <span onclick="startCall('audio')">📞</span>
                <span onclick="startCall('video')">📹</span>
            </div>
        </div>
        <div class="messages-container" id="msgBox">
            <div class="msg incoming">नमस्ते भाई! सब ठीक है?</div>
        </div>
        <div class="chat-footer">
            <input type="text" id="msgInput" placeholder="संदेश टाइप करें...">
            <button onclick="sendMsg()">भेजें</button>
        </div>
    </div>

    <!-- Call Screen UI -->
    <div id="callScreen">
        <div class="call-avatar-big">📞</div>
        <h2 id="callTitle" style="margin-bottom: 5px;">कॉल हो रही है...</h2>
        <p id="callTarget" style="color: #94a3b8;">Sanskari Balak</p>
        <div class="call-buttons">
            <button class="c-btn" style="background: #ef4444;" onclick="endCall()">❌</button>
            <button class="c-btn" style="background: #22c55e;" onclick="alert('कॉल कनेक्ट हो गई है!')">✔️</button>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="nav-bar">
        <button class="nav-tab active" onclick="switchScreen('chatsScreen', this)">💬</button>
        <button class="nav-tab" onclick="switchScreen('profileScreen', this)">👤</button>
    </div>

    <script>
        function switchScreen(screenId, btn) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            btn.classList.add('active');
        }

        function openChat(name) {
            document.getElementById('roomName').innerText = name;
            document.getElementById('chatRoom').style.display = 'flex';
        }

        function closeChat() {
            document.getElementById('chatRoom').style.display = 'none';
        }

        function sendMsg() {
            const input = document.getElementById('msgInput');
            if(!input.value.trim()) return;
            const box = document.getElementById('msgBox');
            box.innerHTML += `<div class="msg outgoing">${input.value}</div>`;
            input.value = '';
            box.scrollTop = box.scrollHeight;
        }

        function startCall(type) {
            document.getElementById('callTitle').innerText = type === 'audio' ? 'ऑडियो कॉल चालू है...' : 'वीडियो कॉल चालू है...';
            document.getElementById('callScreen').style.display = 'flex';
        }

        function endCall() {
            document.getElementById('callScreen').style.display = 'none';
        }
    </script>
</body>
</html>
